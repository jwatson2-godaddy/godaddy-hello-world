<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hello from GoDaddy</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --ink: #111827;
      --muted: #4b5563;
      --accent: #15803d;
    }

    * { box-sizing: border-box; }

    body {
      display: grid;
      place-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 1rem;
      background: var(--bg);
      color: var(--ink);
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      text-align: center;
    }

    h1 {
      margin: 0 0 0.5rem;
      font-size: clamp(2rem, 7vw, 3.5rem);
      letter-spacing: -0.02em;
    }

    p {
      margin: 0;
      color: var(--muted);
    }

    code {
      color: var(--accent);
    }
  </style>
</head>
<body>
  <main>
    <h1>Hello from GoDaddy</h1>
    <p>Running on Node.js and Express. Try <code>/api/hello</code>.</p>
  </main>
</body>
</html>
